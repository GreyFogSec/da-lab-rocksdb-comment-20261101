name: AI Review Comment

on:
  workflow_call:
    inputs:
      result_artifact_name:
        required: true
        type: string
      comment_file:
        required: true
        type: string

permissions:
  pull-requests: write
  issues: write

jobs:
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted scripts and lab boundary fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/scripts
            _artifact
            .lab-protected
          sparse-checkout-cone-mode: true

      - name: Download untrusted review artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.result_artifact_name }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: _artifact

      - name: Verify boundary write and post hash-only evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COMMENT_FILE: ${{ inputs.comment_file }}
        with:
          script: |
            const crypto = require('crypto')
            const fs = require('fs')
            const path = require('path')
            if (!fs.lstatSync('_artifact').isSymbolicLink()) throw new Error('_artifact is not the lab symlink')
            const artifactDir = '_artifact'
            const comment = fs.readFileSync(path.join(artifactDir, process.env.COMMENT_FILE), 'utf8')
            const prNumber = Number(fs.readFileSync(path.join(artifactDir, 'pr_number.txt'), 'utf8').trim())
            const marker = fs.readFileSync('.lab-protected/outside-write.txt')
            const hash = crypto.createHash('sha256').update(marker).digest('hex')
            const {data: created} = await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `${comment.trim()}\n\nLAB DA-01 positive-control hash: \`${hash}\``,
            })
            core.info(`Created evidence comment ${created.id}; protected-write SHA-256 ${hash}`)

  fresh-directory-negative-control:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.result_artifact_name }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/review-artifact
      - run: test -f "$RUNNER_TEMP/review-artifact/comment.md"
